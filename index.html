<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HD TikTok 120FPS Converter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0f0f0f;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: #1a1a1a;
            padding: 30px 24px;
            border-radius: 20px;
            border: 1px solid #333;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        p {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 24px;
        }

        input[type="file"] {
            width: 100%;
            padding: 14px;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 10px;
            color: #fff;
            margin-bottom: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            border: none;
            border-radius: 12px;
            color: #000;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }

        button:active {
            opacity: 0.8;
        }

        .warning {
            margin-top: 16px;
            font-size: 12px;
            color: #ff9999;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 HD TikTok 120FPS</h1>
        <p>Upload video, proses otomatis ke 1080×1920 120fps, hasil lebih smooth & anti pecah.</p>

        <form action="/proses" method="POST" enctype="multipart/form-data">
            <input type="file" name="video" accept="video/*" required>
            <button type="submit">⚡ Proses HD 120FPS</button>
        </form>

        <div class="warning">
            ⚠️ TikTok maksimal menampilkan 60fps. Upload 120fps membuat gerakan lebih stabil & halus.
        </div>
    </div>
</body>
</html>
